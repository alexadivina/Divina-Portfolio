<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8"><>
   <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

   <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
           <a class="navbar -brand" href="#home">
             <i data-lucide="code -2" class="me-2"></i>Divina Portfolio
        </a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navlinks">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navlinks">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#about">About</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="#contact">Contact</a>
            </ul> 
        </div>
    </div>
    </nav>
    
    <!-- Home Section - welcome page -->
     <section id="home" class="hero">
        <div class="container text-center text-white">
            <h1 class="display-4">Welcome to my Portfolio</h1>
            <p class="Lead">I am Divina, a passionate web developer and designer.</p>
            <a href="#about" class="btn btn-primary btn-lg">Learn More</a>
        </div>
     </section>

     <!-- About Me Section -->
      <section id="about" class="py-5">
        <div class="container">
            <h2 class="text-center mb-4">About Me</h2>
            <div class="row">
                <div class="col-md-6">
                    <p>Hello! I am Divina, a web developer and designer with a passion for creating beautiful and functional websites.</p>
                </div>
                <div class="col-md-6">
                    <img src="profile.jpg" alt="Divina" class="img-fluid rounded-circle">
                </div>
                </div>
            </div>
        </div>
      </section>

      <!-- Contact Section -->
       <section id="contact" class="py-5 bg-light">
        <div class="container">
            <h2 class="text-center mb-5">Contact Me</h2>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter Name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter Email">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Messge</label>
                            <textarea class="form-control" id="message" rows="5" placeholder="Enter Message"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
       </section>
